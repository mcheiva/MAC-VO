# Welland half B for cross-fitting (the odd blocks, starts 300..4500), v2 GT, with frame gaps: per 300-frame block 21 x the one-frame pairs (50%)
# and ~900 pairs (~7%) each of gaps 2, 3, 4, 6, 8, 12, 16 frames (frame_stride, offsets cycled; EIVA_NoIMU computes their flow
# from the GT depth and poses), ~100k pairs as the gap-free list; frames and pairs the images do not confirm are gated
# (photo_rel 0.75 x the dive median, floor 0.5; Scripts/Dataset/check_eiva_photo.py); covariance head (frames the half-A matcher fine-tune never saw)
