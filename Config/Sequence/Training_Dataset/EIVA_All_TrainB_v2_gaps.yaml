# Production, half B for cross-fitting: every EIVA dive's odd blocks (Welland and welland_rear
# 300 frames, Vobster 100), v2 GT, frame gaps (half one-frame pairs, ~7% each of 2, 3, 4, 6, 8, 12, 16) and the image gate
# (photo_rel 0.75, photo_floor 0.5); Welland site and Vobster about equal; covariance head (frames the half-A matcher fine-tune never saw).
