# EIVA_RefinedMatcher: stage 1 of solution B, the recommended frontend (docs/reproduce_solution_B.md). Fine-tunes the
# FlowFormer matcher on EIVA; stage 2, EIVA_RefinedHead, then retrains the covariance head on top of it.
# The best settings found (docs/covhead_retrain_summary.md):
#   - start: the 25k recurrent Cholesky base (Model/MACVO_FrontendCov_Chol25k_base.pth; its matcher is the shipped one)
#   - trained: the matcher's decoder and cost layers (flow_trainable: decoder+cost); the image encoders and the covariance
#     head stay frozen. fp32, batch 2, lr 2.5e-5 one-cycle, 20k steps; temporal and stereo steps alternate
#   - data: TartanAir v1 + the 7 training seasidetown sequences x10 + the EVEN blocks (Vobster 100 frames, Welland 300) of
#     all six EIVA dives (EIVA_All_TrainA_v2_water_gaps, from Scripts/Dataset/make_eiva_lists.py), with frame gaps 1-16
#     (half one-frame pairs; without them the fine-tune loses large motion: plane_tail1 #331 EPE 70 px vs 5 px), the
#     image gate (photo_rel 0.75, photo_floor 0.5) and open water as a far stereo target (water_disparity 0.25: without
#     it the matcher reads unseen water as near and trajectories break); no teacher targets
# Run (--training_mode flow is required; the default, cov, would train the head instead):
#   python -u -m Train.MatchingNet.train_flowformer --config Config/Train/EIVA_RefinedMatcher.yaml --training_mode flow
#   -> Model/EIVARefinedMatcher<MM-DD-HH-MM-SS>/20000.pth (B's own: Model/MACVO_FrontendCov_EIVA_B_MatcherStage.pth)
# Formerly FlowFTEIVA_AllA_water_gaps (its name in docs/covhead_retrain_handoff.md); the site folds of the same recipe
# are FlowFTEIVA_WellandA_water_gaps and FlowFTEIVA_VobsterA_water_gaps.

Model:
  name: "EIVARefinedMatcher"
  stage: "tartanair"
  suffix: "sintel"
  gamma: 0.85
  max_flow: 400
  batch_size: 2           # fp32 end to end: batch 4 pages on a 24 GB card, batch 2 peaks at 21.7 GB
  sum_freq: 100
  val_freq: 5000000
  image_size: [480, 640]
  image_scale: 1
  add_noise: True
  # Covariance loss on every pixel with a finite target; True restricts it to flow_mask-valid pixels (ablation).
  cov_mask: False
  # Alternate temporal and stereo (left/right, target -fx b / depth) batches (handoff 5.4).
  stereo: True
  # Train in the deployment precision (MACVO_Fast / Export.py --mode fast); the covariance branch keeps fp32 weights.
  # Flow fine-tune (--training_mode flow): the matcher trains in fp32 (master weights); deployment runs it in fp16 / bf16.
  encoder_dtype: fp32
  decoder_dtype: fp32
  # decoder+cost: the two pretrained Twins image encoders stay frozen (see train_flowformer.py)
  flow_trainable: decoder+cost

  critical_params: []
  transformer: "latentcostformer"
  # The 25k recurrent Cholesky base (CovHeadChol, step 25000; its matcher is the shipped one).
  restore_ckpt: "Model/MACVO_FrontendCov_Chol25k_base.pth"

  # latentcostformer
  latentcostformer:
    cov_channels: 3     # Cholesky factor of the full 2x2 flow covariance (handoff 5.2)
    cov_fp32: true
    pe: "linear"
    dropout: 0.0
    encoder_latent_dim: 256 # in twins, this is 256
    query_latent_dim: 64
    cost_latent_input_dim: 64
    cost_latent_token_num: 8
    cost_latent_dim: 128
    arc_type: "transformer"
    cost_heads_num: 1
    # encoder
    pretrain: True
    context_concat: False
    encoder_depth: 3
    feat_cross_attn: False
    patch_size: 8
    patch_embed: "single"
    no_pe: False
    gma: "GMA"
    kernel_size: 9
    rm_res: True
    vert_c_dim: 64
    cost_encoder_res: True
    cnet: "twins"
    fnet: "twins"
    no_sc: False
    only_global: False
    add_flow_token: True
    use_mlp: False
    vertical_conv: False

    # decoder
    decoder_depth: 12
    critical_params: ["cost_heads_num", 
                      "vert_c_dim", 
                      "cnet", 
                      "pretrain", 
                      "add_flow_token", 
                      "encoder_depth", 
                      "gma", 
                      "cost_encoder_res"
                      ]

  ### TRAINER

  clip           : 1.0
  num_steps      : &num_steps 20000
  
  optimizer:
    type: "AdamW"
    args:
      lr          : &lr 2.5e-5     # domain fine-tune of the pretrained matcher
      weight_decay: 1.0e-5
      eps         : 1.0e-8
  
  scheduler:
    type: "OneCycleLR"
    args: 
      total_steps: *num_steps
      pct_start: 0.05
      cycle_momentum: False
      max_lr: *lr
      anneal_strategy: "linear"

  folderlength: None
  autosave_freq: 5000
  num_workers: 0
  mixed_precision: False

  seed: 1234
  log_freq: 100
  datatype: fp32

Train:
  data: !flatten_seq 
    - !include ../Sequence/Training_Dataset/TartanAirV1_Zip.yaml
    - !include ../Sequence/Training_Dataset/EIVA_All_TrainA_v2_water_gaps.yaml
    # Production: every EIVA dive's even blocks (cross-fit), + the seaside oversampling
    - !include ../Sequence/Training_Dataset/TartanAirV1_Seaside_Train.yaml


Evaluate:
  data: !flatten_seq 
    - !include ../Sequence/Training_Dataset/EIVA_Vobster_v2.yaml
    - !include ../Sequence/Training_Dataset/EIVA_Welland_v2.yaml